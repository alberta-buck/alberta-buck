name: sandbox-pages

# The browser sandbox (core/js/sandbox), hosted on Cloudflare Pages.  The page
# is static -- every visitor's world runs in their own tab -- so a deploy is
# the built dist/ uploaded as it is.  master publishes the production site;
# any other branch here gets a preview at <branch>.<project>.pages.dev.
#
# Secrets (repository settings): CLOUDFLARE_API_TOKEN, a token with the
# "Cloudflare Pages: Edit" permission, and CLOUDFLARE_ACCOUNT_ID.  Without
# them the site is still built and tested, and the deploy is skipped.

on:
  push:
    branches: [master, feature/public]
    paths:
      - core/js/**
      - core/rust/**
      - src/**
      - alberta_buck/sim/artifacts/**
      - scripts/stage-uniswap.mjs
      - Makefile
      - package.json
      - package-lock.json
      - .github/workflows/sandbox-pages.yml
  workflow_dispatch:

concurrency:
  group: sandbox-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: alberta-buck-sandbox

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'        # npm 10: core/js's lockfile needs it for npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The one contract the sandbox compiles (UniswapV3BindingAdapter);
      # pinned to the flake's Foundry, as the release workflows are.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Root npm dependencies (Uniswap's published contracts)
        run: npm ci --no-audit --no-fund

      - name: Build the sandbox
        run: make sandbox-build

      - name: The built page passes its browser test
        working-directory: core/js
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright
        run: |
          npx playwright-core install --with-deps chromium-headless-shell
          node --test test/sandbox.browser.test.js

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::notice::No Cloudflare secrets: the sandbox was built and tested, not deployed."
            exit 0
          fi
          W="npx --yes wrangler@4"
          if ! $W pages project list | grep -q "\b${PROJECT}\b"; then
            $W pages project create "${PROJECT}" --production-branch=master
          fi
          $W pages deploy core/js/sandbox/dist --project-name="${PROJECT}" \
            --branch="${GITHUB_REF_NAME}" --commit-hash="${GITHUB_SHA}" \
            --commit-message="$(git log -1 --format=%s)"
