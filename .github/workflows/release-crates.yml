# Publish the Alberta Buck kernel crates to crates.io.
#
# Trigger: an rs-v* tag, e.g.
#
#     git tag rs-v0.1.1 && git push origin rs-v0.1.1
#
# Authentication is OIDC trusted publishing -- no token is stored anywhere.
# It requires a Trusted Publisher configured on crates.io for EACH crate:
# owner alberta-buck, repository alberta-buck, workflow release-crates.yml.
# Note that the claim must match exactly: if you set an Environment in the
# crates.io configuration, add the matching `environment:` key below, and if
# you did not, leave it absent.  crates.io also requires the crate to exist
# before a trusted publisher can be configured, which is why 0.1.0 went out
# by hand (alberta-buck-deployment.org, P1).
#
# The four crates move as one version and publish in dependency order; each
# publish waits for the index before the next begins.

name: Release crates

on:
  push:
    tags:
      - 'rs-v*'

concurrency:
  group: release-crates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish kernels to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # required for crates.io trusted publishing

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Tag matches the workspace version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#rs-v}"
          ver=$(python3 -c "import tomllib;print(tomllib.load(open('core/rust/Cargo.toml','rb'))['workspace']['package']['version'])")
          echo "tag=$tag workspace version=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag rs-v$tag does not match [workspace.package] version $ver" >&2
            exit 1
          fi

      - name: Inter-crate version requirements are current
        # The kernels depend on each other by both path and version.  A
        # caret requirement of "0.1" keeps matching 0.1.x, but silently
        # resolves to the PREVIOUS release once the workspace moves to
        # 0.2.0 -- which would publish a crate built against its own old
        # sibling.  Fail loudly instead.
        run: |
          python3 - <<'EOF'
          import sys, tomllib
          root = tomllib.load(open("core/rust/Cargo.toml", "rb"))
          ver  = root["workspace"]["package"]["version"]
          want = ".".join(ver.split(".")[:2])          # 0.x caret == major.minor
          bad  = []
          for crate in ("buck-math", "buck-identity", "buck-registry", "buck-wallet"):
              m = tomllib.load(open(f"core/rust/{crate}/Cargo.toml", "rb"))
              for key, dep in m.get("dependencies", {}).items():
                  if not isinstance(dep, dict):
                      continue
                  name = dep.get("package", key)
                  if not name.startswith("alberta-buck-"):
                      continue
                  req = str(dep.get("version", ""))
                  if ".".join(req.lstrip("^~=").split(".")[:2]) != want:
                      bad.append(f"{crate}: {name} = \"{req}\" but the workspace is at {ver}")
          if bad:
              print("::error::stale inter-crate version requirements:", file=sys.stderr)
              for b in bad:
                  print(f"  {b}", file=sys.stderr)
              sys.exit(1)
          print(f"inter-crate requirements track {ver}")
          EOF

      - name: Vendored vectors match the canonical files
        run: make core-vectors-check

      - name: Poseidon constants regenerate from the specification
        run: make poseidon-constants-check

      - name: Test
        run: cargo test --manifest-path core/rust/Cargo.toml

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          for crate in alberta-buck-math \
                       alberta-buck-identity \
                       alberta-buck-registry \
                       alberta-buck-wallet; do
            echo "::group::publish $crate"
            cargo publish --manifest-path core/rust/Cargo.toml -p "$crate"
            echo "::endgroup::"
          done
