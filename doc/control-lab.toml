# All prices are positive: a DC level plus the three phases, 120 degrees apart.
days = 120
ticks_per_day = 4
seed = 41404

[feed]
base = [100.0, 100.0, 100.0]
amplitude = 0.12
period_days = 30.0
# The interactive campaign overrides amplification with 0, 0.5 and 1.
# Independent log-price Brownian walks begin at zero, never in bootstrap.
walk_amplification = 0.0
walk_daily_sigma = 0.01

# Historical EMA state is built from these pre-day-zero baseline observations.
# Profile perturbations (including noise) never enter this history.
[bootstrap]
history_days = 1280
# Give every stage the same funded, settled LP book before live day zero.
# Both quote routes are then aligned to the selected opening TOKEN prices.
basket_warmup_days = 120

[basket]
tilt = 0.0

# Private actors have an accumulation/divestment intent even at fair value.
# A 1% adverse price multiplies the desired rate by exp(-1); favourable
# prices increase it, bounded by max_per_day and available cash/credit.
[demand]
budget_usdc = 1000000
rate_at_par_per_day = 5000
backoff_bp = 100
max_per_day = 25000

[supply]
credit_face_buck = 1000000
rate_at_par_per_day = 5000
backoff_bp = 100
max_per_day = 25000

[[profiles]]
name = "three-phase"

[[profiles]]
name = "mixed"

# Common positive and negative pulses exercise both sides of monetary policy.
[[profiles.perturbations]]
kind = "triangle"
tokens = [0, 1, 2]
start = 15
duration = 40
amplitude = 0.15

[[profiles.perturbations]]
kind = "triangle"
tokens = [0, 1, 2]
start = 65
duration = 40
amplitude = -0.15

# A lasting relative-price change in TOKEN C.
[[profiles.perturbations]]
kind = "ramp"
tokens = [2]
start = 35
duration = 30
amplitude = 0.10

[[profiles.perturbations]]
kind = "noise"
tokens = [0, 1, 2]
independent = true
amplitude = 0.002

[[profiles]]
name = "shock"

# Select this separately with --profiles shock to inspect invalid samples.
[[profiles.perturbations]]
kind = "step"
tokens = [0]
start = 45
duration = 10
amplitude = 0.30
