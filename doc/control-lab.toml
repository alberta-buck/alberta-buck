# All prices are positive: a DC level plus the three phases, 120 degrees apart.
days = 120
ticks_per_day = 4
seed = 41404

[feed]
base = [100.0, 100.0, 100.0]
amplitude = 0.12
period_days = 30.0
# The interactive campaign overrides amplification with 0, 0.5 and 1.
# Independent log-price Brownian walks begin at zero, never in bootstrap.
walk_amplification = 0.0
walk_daily_sigma = 0.01

# A historical profile takes its reference means from this many earlier days.
[bootstrap]
history_days = 1280
# Give every stage the same funded, settled LP book before live day zero.
# Both quote routes are then aligned to the selected opening TOKEN prices.
basket_warmup_days = 120

# A target leans against price. Each TOKEN's target is its declared weight
# times (reference price / price) to the power `tilt`, shared out over the
# book. A liquidity position's share moves half as far as a wallet's, so
# tilt = 0.5 asks for the other half; 0 restores the declared weights and no
# more. `lean_cap_bp` is the most a target may lean, as bp of its declared
# weight; it must stay inside the leash.
[basket]
tilt = 0.5
lean_cap_bp = 1500
# The book leans against parity: it aims to hold (BUCK cheap) or to have issued
# (dear) this many times the parity error, as a share of its equity.
parity_gain = 5.0

# How fast a separated pair closes an eligible gap: fractions of what remains
# per day, so 0.693 (ln 2) halves it each day. The braking release may ask for
# up to release_rate and a confident closure for closure_rate; max_rate caps
# their sum at half the remaining gap a day. release_speed = 0 and
# closure_gain = 0 judge both against the rate's own allowance, so no speed is
# fitted to these synthetic cycles. The first experiment's values (0.002, 0.1,
# 20, 0, 1) remain the code defaults.
#
# Which gaps may be worked at all is decided by urgency that builds: each
# constituent counts its distance from target beyond `slack` (a share of the
# book: 0.0025 is a quarter point) over time, and may be rebalanced once the
# count reaches `patience` (share-days: 0.02 is two point-days). It then stays
# eligible until its gap is back inside the slack. patience = 0, the code
# default, uses the basket's fixed weight band instead.
[pair]
release_speed = 0.0
release_rate = 4.0
closure_gain = 0
closure_rate = 0.693147
max_rate = 0.693147
impact_share = 1.0
slack = 0.0025
patience = 0.02

# Private actors have an accumulation/divestment intent even at fair value.
# A 1% adverse price multiplies the desired rate by exp(-1); favourable
# prices increase it, bounded by max_per_day and available cash/credit.
[demand]
budget_usdc = 1000000
rate_at_par_per_day = 5000
backoff_bp = 100
max_per_day = 25000

[supply]
credit_face_buck = 1000000
rate_at_par_per_day = 5000
backoff_bp = 100
max_per_day = 25000

[[profiles]]
name = "three-phase"

[[profiles]]
name = "mixed"

# Common positive and negative pulses exercise both sides of monetary policy.
[[profiles.perturbations]]
kind = "triangle"
tokens = [0, 1, 2]
start = 15
duration = 40
amplitude = 0.15

[[profiles.perturbations]]
kind = "triangle"
tokens = [0, 1, 2]
start = 65
duration = 40
amplitude = -0.15

# A lasting relative-price change in TOKEN C.
[[profiles.perturbations]]
kind = "ramp"
tokens = [2]
start = 35
duration = 30
amplitude = 0.10

[[profiles.perturbations]]
kind = "noise"
tokens = [0, 1, 2]
independent = true
amplitude = 0.002

[[profiles]]
name = "shock"

# Select this separately with --profiles shock to inspect invalid samples.
[[profiles.perturbations]]
kind = "step"
tokens = [0]
start = 45
duration = 10
amplitude = 0.30

# Three uncorrelated commodity-like prices around a common USD inflation
# trend (control_lab/commodities.py). One lab day is one month of market time,
# so 120 days span a decade. Inflation is 3% a year with a two-year burst at
# 9%; each TOKEN follows it through its own lag and adds a bounded oscillation
# of its own. Spreads, crossing times and bounds are what a ten-year stretch of
# each real series shows against US CPI (doc/review/commodity-inflation.py);
# the lags are the M2 lags of doc/BASKET-REBALANCE.md, with gold's fast prior.
# A complete path: it takes no three-phase sine, random walk or perturbation.
[[profiles]]
name = "commodities"

[profiles.commodities]
months_per_day = 1.0
inflation = [[0, 3.0], [36, 9.0], [60, 3.0]]
components = 10
noise = 0.0015

[[profiles.commodities.tokens]]
label = "Fast, gold-like"
lag_months = 3.0
spread = 0.12
crossing_months = 12.0
floor = -0.24
ceiling = 0.34

[[profiles.commodities.tokens]]
label = "Mid, energy-like"
lag_months = 13.0
spread = 0.07
crossing_months = 11.0
floor = -0.16
ceiling = 0.22

[[profiles.commodities.tokens]]
label = "Slow, labour-like"
lag_months = 16.0
spread = 0.012
crossing_months = 20.0
floor = -0.023
ceiling = 0.032
