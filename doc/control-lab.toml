# All prices are positive: a DC level plus the three phases, 120 degrees apart.
days = 120
ticks_per_day = 4
seed = 41404

[feed]
base = [100.0, 100.0, 100.0]
amplitude = 0.12
period_days = 30.0
# The interactive campaign overrides amplification with 0, 0.5 and 1.
# Independent log-price Brownian walks begin at zero, never in bootstrap.
walk_amplification = 0.0
walk_daily_sigma = 0.01

# Historical EMA state is built from these pre-day-zero baseline observations.
# Profile perturbations (including noise) never enter this history.
[bootstrap]
history_days = 1280
# Give every stage the same funded, settled LP book before live day zero.
# Both quote routes are then aligned to the selected opening TOKEN prices.
basket_warmup_days = 120

[basket]
tilt = 0.0

# How much of an eligible allocation gap a separated pair releases (fractions
# of the gap per day). release_speed = 0 and closure_gain = 0 judge both the
# braking release and closure against the rate's own allowance, so no speed is
# fitted to these synthetic cycles. Chosen from control-lab/basket-sizing: the
# first experiment's values (0.002, 0.1, 20, 0, 1) remain the code defaults.
[pair]
release_speed = 0.0
release_rate = 4.0
closure_gain = 0
closure_rate = 1.0
max_rate = 4.0
impact_share = 1.0

# Private actors have an accumulation/divestment intent even at fair value.
# A 1% adverse price multiplies the desired rate by exp(-1); favourable
# prices increase it, bounded by max_per_day and available cash/credit.
[demand]
budget_usdc = 1000000
rate_at_par_per_day = 5000
backoff_bp = 100
max_per_day = 25000

[supply]
credit_face_buck = 1000000
rate_at_par_per_day = 5000
backoff_bp = 100
max_per_day = 25000

[[profiles]]
name = "three-phase"

[[profiles]]
name = "mixed"

# Common positive and negative pulses exercise both sides of monetary policy.
[[profiles.perturbations]]
kind = "triangle"
tokens = [0, 1, 2]
start = 15
duration = 40
amplitude = 0.15

[[profiles.perturbations]]
kind = "triangle"
tokens = [0, 1, 2]
start = 65
duration = 40
amplitude = -0.15

# A lasting relative-price change in TOKEN C.
[[profiles.perturbations]]
kind = "ramp"
tokens = [2]
start = 35
duration = 30
amplitude = 0.10

[[profiles.perturbations]]
kind = "noise"
tokens = [0, 1, 2]
independent = true
amplitude = 0.002

[[profiles]]
name = "shock"

# Select this separately with --profiles shock to inspect invalid samples.
[[profiles.perturbations]]
kind = "step"
tokens = [0]
start = 45
duration = 10
amplitude = 0.30

# Three uncorrelated commodity-like prices around a common USD inflation
# trend (control_lab/commodities.py). One lab day is one month of market time,
# so 120 days span a decade. Inflation is 3% a year with a two-year burst at
# 9%; each TOKEN follows it through its own lag and adds a bounded oscillation
# of its own. Spreads, crossing times and bounds are what a ten-year stretch of
# each real series shows against US CPI (doc/review/commodity-inflation.py);
# the lags are the M2 lags of doc/BASKET-REBALANCE.md, with gold's fast prior.
# A complete path: it takes no three-phase sine, random walk or perturbation.
[[profiles]]
name = "commodities"

[profiles.commodities]
months_per_day = 1.0
inflation = [[0, 3.0], [36, 9.0], [60, 3.0]]
components = 10
noise = 0.0015

[[profiles.commodities.tokens]]
label = "Fast, gold-like"
lag_months = 3.0
spread = 0.12
crossing_months = 12.0
floor = -0.24
ceiling = 0.34

[[profiles.commodities.tokens]]
label = "Mid, energy-like"
lag_months = 13.0
spread = 0.07
crossing_months = 11.0
floor = -0.16
ceiling = 0.22

[[profiles.commodities.tokens]]
label = "Slow, labour-like"
lag_months = 16.0
spread = 0.012
crossing_months = 20.0
floor = -0.023
ceiling = 0.032
