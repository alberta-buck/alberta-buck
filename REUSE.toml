version = 1
SPDX-PackageName = "alberta-buck"
SPDX-PackageSupplier = "Perry Kundert <perry@dominionrnd.com>"
SPDX-PackageDownloadLocation = "https://github.com/alberta-buck/alberta-buck"

# Licensing is declared HERE rather than by stamping ~657 source files with
# per-file SPDX headers.  This is the REUSE Specification's supported
# alternative to file headers, and the same compliance scanners that would
# otherwise flag those files as "unknown licence" read this instead.
#
# LICENSING.md is the human-readable version of the same map and remains the
# decision of record; this file is its machine-readable twin.  Keep them in
# step.  New files should still carry a header (see CONTRIBUTING.md) so that a
# file copied OUT of this repo carries its terms with it -- the one thing a
# central declaration cannot do.

# --- The kernels: CAL-1.0 ------------------------------------------------- #
# Chosen because it restricts architecture rather than purpose: an operator
# must be able to hand a user their own data, and may not use key custody to
# limit a user's control of it.
[[annotations]]
path = ["core/rust/**", "core/python/**", "core/python-kernel/**", "core/js/**", "core/README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Perry Kundert"
SPDX-License-Identifier = "CAL-1.0"

# --- Contracts and the application layer: GPL-3.0-or-later ---------------- #
[[annotations]]
path = ["src/**", "alberta_buck/**", "test/**", "scripts/**", "circuits/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Perry Kundert"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- Generated Groth16 verifiers: GPL-3.0-or-later ------------------------ #
# These are emitted by snarkjs from its own template and left byte-for-byte
# as generated.  The "SPDX-License-Identifier: GPL-3.0" tag in each file is
# the deprecated, ambiguous SPDX identifier; the licence notice in the same
# header (written by 0KIMS association, the copyright holder) grants "either
# version 3 of the License, or (at your option) any later version" -- the
# standard -or-later grant.  Declaring GPL-3.0-or-later here transcribes that
# notice; it is not a relicensing.  (If template output is not snarkjs-derived
# at all -- the classic Bison/GCC question -- the files are freer still, so
# -or-later is safe on either reading.)
[[annotations]]
path = [
  "src/SpendGroth16Verifier.sol",
  "src/RegressVerifier.sol",
  "src/MintBatchN*Groth16Verifier.sol",
  "src/MintBatchA2N*Groth16Verifier.sol",
  "test/reference/*Groth16VerifierStock.sol",
  "src/NoteBinding*Groth16Verifier.sol",
  "src/IdentityMembership*Verifier.sol",
]
precedence = "override"
SPDX-FileCopyrightText = "2021 0KIMS association"
SPDX-License-Identifier = "GPL-3.0-or-later"
SPDX-FileComment = "Generated by snarkjs; in-file notice grants GPLv3 'or (at your option) any later version'."

# --- Contract distribution packages: GPL-3.0-or-later ---------------------- #
# core/contracts ships the compiled ABI/bytecode of src/*.sol (npm + PyPI
# "alberta-buck-contracts") and follows the contracts' licence, which both
# package manifests already self-declare.
[[annotations]]
path = ["core/contracts/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Perry Kundert"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- Build, packaging, CI and repo-meta glue: GPL-3.0-or-later ------------- #
[[annotations]]
path = [
  ".env.example", ".gas-snapshot", ".github/**", ".gitignore", ".gitmodules",
  "Makefile", "flake.nix", "flake.lock", "foundry.toml", "foundry.lock",
  "package.json", "package-lock.json", "pyproject.toml",
  "CONTRIBUTING.md", "LICENSING.md", "NOTICE", "TRADEMARKS.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Perry Kundert"
SPDX-License-Identifier = "GPL-3.0-or-later"

# --- Uniswap-derived --------------------------------------------------- #
[[annotations]]
path = "src/lib/UniswapV3OracleLib.sol"
precedence = "override"
SPDX-FileCopyrightText = "Uniswap Labs and contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Vendored build artifacts of Uniswap's own contracts, compiled from the
# sources the Makefile names (lib/universal-router, and the Permit2 it pins).
[[annotations]]
path = "alberta_buck/sim/artifacts/UniversalRouter.json"
precedence = "override"
SPDX-FileCopyrightText = "Uniswap Labs"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "alberta_buck/sim/artifacts/Permit2.json"
precedence = "override"
SPDX-FileCopyrightText = "2022 Uniswap Labs"
SPDX-License-Identifier = "MIT"

# --- Design documents: NOT open --------------------------------------- #
# The .org design writing is the largest original asset here and is
# deliberately NOT placed under the code licences.  All rights reserved,
# which is the current legal default made explicit rather than left
# undeclared.  This is the reversible direction: relaxing it later to an
# open licence is one line; an open grant cannot be withdrawn.
[[annotations]]
path = ["*.org", "doc/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Perry Kundert"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

# Renders of the .org documents (root-level .pdf/.txt, the images/ figures)
# carry the same terms as their sources.
[[annotations]]
path = ["*.pdf", "*.txt", "images/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Perry Kundert"
SPDX-License-Identifier = "LicenseRef-AllRightsReserved"

# --- Data, fixtures and vectors --------------------------------------- #
# JSON and CSV carry no comment syntax, so a header is impossible; these are
# the files a central declaration exists for.
[[annotations]]
path = ["test/vectors/**", "core/vectors/**", "alberta_buck/**/*.json", "alberta_buck/sim/prices/*.csv"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Perry Kundert"
SPDX-License-Identifier = "GPL-3.0-or-later"
