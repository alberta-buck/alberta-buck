# Credit-adoption stress: a society-wide uptake wave (+0.25 cap_frac on every
# borrower) at day 900, then two NEW borrowers enter at day 1100.  The rolling
# funding reserve must throttle the wave into an orderly ramp (pre-buy toll)
# and the controller re-settle without flooding basketValue.

name = "shock-uptake"
notes = "uptake +0.25 all @900; +2 borrowers @1100"

[scenario]
years = 5.0
ticks_per_day = 1
day_step = 10
seed = 0xA1BC

[[interventions]]
day = 900
action = "uptake_shock"
idx = "all"
mag = 0.25

[[interventions]]
day = 1100
action = "add_agents"
cls = "FatCreditBorrowerAgent"
n = 2
