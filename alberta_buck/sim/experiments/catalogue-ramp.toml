# Excursion CATALOGUE arm "ramp" -- the portcast cast (settled physics,
# keyed rng, no FatCredit) on a 2-year window with ONE injected excursion
# at day 365.  The defender mix and intensity are swept from outside
# (alberta_buck.sim.catalogue overrides the Excursion*/CommodityRebal
# counts); this file fixes the physics and the injection only.
# Design of record: doc/REBALANCING-EQ.org, "The excursion catalogue";
# WP-15: WAVE3.org test-plan class 6 (a growing disturbance; the internal-
# model limit -- a ramp wants a double integrator, measure the residual).
# The plan's uptake_shock acts through FatCreditBorrowerAgent.extra_cap and
# the catalogue cast has no FatCredit borrowers, so borrower uptake is
# ramped as POPULATION: from day 365 one honest debtor is added every 10
# days for 180 days (18, +60% of the cast's 30), each made to arrive at
# once (set_knob on its ordinal: the endogenous clock off, arrive_day
# pinned) -- a staircase of refinancings whose cumulative issuance is a
# ramp.
name = "catalogue-ramp"
notes = "class 6 ramp: borrower uptake ramped over 180 days from day 365 -- one BuckCreditDebtorAgent added every 10 days (18 in all)"

[scenario]
family = "rebalancing-eq"
rng = "keyed"
years = 2.0
ticks_per_day = 4
day_step = 1
seed = 0xA1BC

[deploy]
target_buck_lp_m = 50.0     # deep national-scale BUCK/USDC exit route

[scenario.agents]
FatCreditBorrowerAgent = 0
BuckCreditDebtorAgent = 30
DirectMintAgent = 120
DirectMintBuckAgent = 30
ArrivingDMAgent = 60
ExcursionArbAgent = 5
ExcursionCreditArbAgent = 3

[agents.SaverAgent]
arrive_mode = "endow"
endow_m = [1, 3]

[agents.BuckCreditDebtorAgent]
theta = [0.0, 3.0]
apr = [0.045, 0.065]
home_k = [200, 1500]        # appraised home value, $k, LOG-uniform
ltv = [0.05, 0.95]          # seasoned mortgage ladder, mean ~50% LTV
income_frac = [0.20, 0.35]  # homes at ~3-5x income
premium_bp = [50, 150]
save_rate = [0.25, 0.75]
refi_mode = "atomic"        # ex-ante whole-conversion evaluation
arrive_mode = "endog"
arrive_frac = [0.0, 1.0]
arr_gain = 5.0
arr_max = 3.0
arr_k_ref = 0.75

[agents.ArrivingDMAgent]
arrive_mode = "endog"
arrive_frac = [0.0, 1.0]
ticket_k = [300, 700]
enter_ptick = 2e-3
exit_ptick = 2e-3
dep_dev_ref = 0.02
dep_halflife = 90.0

# -- the injection: class 6, the uptake ramp ----------------------------- #
[[interventions]]
day = 365
action = "add_agents"
cls = "BuckCreditDebtorAgent"
n = 1

[[interventions]]
day = 365
action = "set_knob"
cls = "BuckCreditDebtorAgent"
idx = [30]
knob = "_endog"
value = false

[[interventions]]
day = 365
action = "set_knob"
cls = "BuckCreditDebtorAgent"
idx = [30]
knob = "arrive_day"
value = 365

