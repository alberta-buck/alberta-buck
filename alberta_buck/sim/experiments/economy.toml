# The household economy (doc/review/household-economy-plan.org): debtors and insured savers who
# supply BUCKs, investors who demand them, arriving while the world runs and drawn by the price gap;
# the market's plumbing; and the basket machine with its wheel and desk.  Nothing else issues or
# buys BUCKs: no synthetic borrowers, older savers or depositors, desk stand-ins or excursion
# arbitrageurs.  This file is the grid's centre; alberta_buck/sim/economy.py varies the population's
# rates, the price path and the seed around it.
name = "economy"
notes = "households only: debtors and savers supply, investors demand; arrivals drawn by the price gap"

[scenario]
family = "rebalancing-eq"
rng = "keyed"
years = 5.0
ticks_per_day = 2
day_step = 1
seed = 0xA1BC
basket = "equity-machine"
tokens = ["LABR", "CNST", "FOOD", "NRGC", "PAXG"]

[deploy]
# A BUCK/USDC pool sized to this economy. At $50M it set the BUCK's dollar price by itself: the
# households' flows of a few million a year could not move it after the basket (2026-10-17).
target_buck_lp_m = 10.0

# The family's plumbing stays: the whale pinning TOKEN/USDC to the price path, the cycle
# arbitrageurs and accumulators, the bootstrap LPs that open the TOKEN/BUCK pools, the keepers.
[scenario.agents]
FatCreditBorrowerAgent = 0
SaverAgent = 0
BuckCreditDebtorAgent = 0
ExternalDebtRetireeAgent = 0
DirectMintAgent = 0
DirectMintBuckAgent = 0
ArrivingDMAgent = 0
ExcursionArbAgent = 0
ExcursionCreditArbAgent = 0
UndertakingAgent = 0
ShockAgent = 0
MonetaryKeeperAgent = 1     # turns the basket's desk
BasketWheelAgent = 1
HouseholdPopulationAgent = 1

# The centre is balanced: at base rates the investors bring about as many dollars a year as the
# debtors bring BUCKs to sell (6 debtors a year at ~$290k of mortgage; 30 investors at ~$55k plus
# their saving). With 12 investors a year the BUCK ran 1-3% cheap and K wound to its floor.
[agents.HouseholdPopulationAgent]
initial_debtors = 6
initial_savers = 6
initial_investors = 30
debtor_rate = 6.0           # arrivals a year at the base pace
saver_rate = 6.0
investor_rate = 30.0
growth = "steady"
gain = 200.0                # pace x (1 + 200 x gap): twice as fast at a 0.5% gap
gain_cap = 8.0
k_ref = 0.75                # issuers also arrive (1 - 0.75) / (1 - K) times as fast: 5x at K 0.95
signal_halflife_days = 30.0
# Households repay BUCKs only when they sell the asset (10% a year); spare income goes into the basket.
surplus_policy = "basket"
divest_rate = 0.1
carry_utilization = 0.3     # savers keep 30% of their K-scaled limit drawn

[agents.BasketWheelAgent]
impl = "solidity"
start = "token"
cap_bp = 200
max_work = 12
chain = "l2"
call = "profitable"
