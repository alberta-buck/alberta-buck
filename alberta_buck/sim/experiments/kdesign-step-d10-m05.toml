# WP-16 step-test cell -- generated by `python -m alberta_buck.sim.kdesign tomls`
# from catalogue-none.toml (the physics and the cast are that file's, verbatim).
# Cell d10-m05: depth target_buck_m 10, K0 step -0.05 at day 150.
# Excursion CATALOGUE arm "none" -- the portcast cast (settled physics,
# keyed rng, no FatCredit) on a 2-year window with ONE injected excursion
# at day 365.  The defender mix and intensity are swept from outside
# (alberta_buck.sim.catalogue overrides the Excursion*/CommodityRebal
# counts); this file fixes the physics and the injection only.
# Design of record: doc/REBALANCING-EQ.org, "The excursion catalogue".
name = "kdesign-step-d10-m05"
notes = "WP-16 step test: none arm + undertakings, gains off day 120, K held 0.75, K0 step -0.05 day 150"

[scenario]
family = "rebalancing-eq"
rng = "keyed"
years = 2.0
ticks_per_day = 4
day_step = 1
seed = 0xA1BC
days = 365
basket = "ops"

[deploy]
target_buck_lp_m = 50.0     # deep national-scale BUCK/USDC exit route
target_buck_m = 10       # WP-16: the depth axis (10 | 40)

[scenario.agents]
FatCreditBorrowerAgent = 0
BuckCreditDebtorAgent = 30
DirectMintAgent = 120
DirectMintBuckAgent = 30
ArrivingDMAgent = 60
ExcursionArbAgent = 5
ExcursionCreditArbAgent = 3
UndertakingAgent = 1        # WP-16: the book the observer aggregates

[agents.SaverAgent]
arrive_mode = "endow"
endow_m = [1, 3]

[agents.BuckCreditDebtorAgent]
theta = [0.0, 3.0]
apr = [0.045, 0.065]
home_k = [200, 1500]        # appraised home value, $k, LOG-uniform
ltv = [0.05, 0.95]          # seasoned mortgage ladder, mean ~50% LTV
income_frac = [0.20, 0.35]  # homes at ~3-5x income
premium_bp = [50, 150]
save_rate = [0.25, 0.75]
refi_mode = "atomic"        # ex-ante whole-conversion evaluation
arrive_mode = "endog"
arrive_frac = [0.0, 1.0]
arr_gain = 5.0
arr_max = 3.0
arr_k_ref = 0.75

[agents.ArrivingDMAgent]
arrive_mode = "endog"
arrive_frac = [0.0, 1.0]
ticket_k = [300, 700]
enter_ptick = 2e-3
exit_ptick = 2e-3
dep_dev_ref = 0.02
dep_halflife = 90.0

# -- WP-16: a book in front of K, and the K step ------------------------- #
[agents.UndertakingAgent]
eps = 0.005                 # the default 3% band never trades on the calm arm
p = 1.0

[[interventions]]
day = 120
action = "set_gains"        # raw: Kp = Ki = Kd = 0, the price loop open
kp = 0.0
ki = 0.0
kd = 0.0

[[interventions]]
day = 120
action = "set_k0"           # with Ki = 0 the K0 move is the live K (no re-derivation)
k0 = 0.75

[[interventions]]
day = 150
action = "set_k0"           # the step: K 0.75 -> 0.7, held open-loop to the end
k0 = 0.7
