# Excursion CATALOGUE arm "lpexit" -- the portcast cast (settled physics,
# keyed rng, no FatCredit) on a 2-year window with ONE injected excursion
# at day 365.  The defender mix and intensity are swept from outside
# (alberta_buck.sim.catalogue overrides the Excursion*/CommodityRebal
# counts); this file fixes the physics and the injection only.
# Design of record: REBALANCING-EQ.org, "The excursion catalogue";
# WP-15: WAVE3.org test-plan class 10 (the D-dependence of design S; V
# should be invariant).  The cast has no BuckPoolInvestorAgent, so the
# private BUCK/USDC depth is the SimLP seed (deploy.target_buck_lp_m):
# LpExitAgent (pusher_agent.py) burns frac of it at exit_day and holds the
# principal.  NB the observer's D (BuckBasketOps.shadowDepth) is the BUCK
# in the TOKEN/BUCK basket pools; the --set variant
# agents.LpExitAgent.venue=basket is a depositor of depth_m $M of TOKEN
# who leaves at exit_day, which moves D itself (reports/wp-15.org).
name = "catalogue-lpexit"
notes = "class 10 liquidity withdrawal: half the SimLP-seeded BUCK/USDC depth removed at day 365 (LpExitAgent, venue ub)"

[scenario]
family = "rebalancing-eq"
rng = "keyed"
years = 2.0
ticks_per_day = 4
day_step = 1
seed = 0xA1BC

[deploy]
target_buck_lp_m = 50.0     # deep national-scale BUCK/USDC exit route

[scenario.agents]
LpExitAgent = 1
FatCreditBorrowerAgent = 0
BuckCreditDebtorAgent = 30
DirectMintAgent = 120
DirectMintBuckAgent = 30
ArrivingDMAgent = 60
ExcursionArbAgent = 5
ExcursionCreditArbAgent = 3

[agents.SaverAgent]
arrive_mode = "endow"
endow_m = [1, 3]

[agents.BuckCreditDebtorAgent]
theta = [0.0, 3.0]
apr = [0.045, 0.065]
home_k = [200, 1500]        # appraised home value, $k, LOG-uniform
ltv = [0.05, 0.95]          # seasoned mortgage ladder, mean ~50% LTV
income_frac = [0.20, 0.35]  # homes at ~3-5x income
premium_bp = [50, 150]
save_rate = [0.25, 0.75]
refi_mode = "atomic"        # ex-ante whole-conversion evaluation
arrive_mode = "endog"
arrive_frac = [0.0, 1.0]
arr_gain = 5.0
arr_max = 3.0
arr_k_ref = 0.75

[agents.ArrivingDMAgent]
arrive_mode = "endog"
arrive_frac = [0.0, 1.0]
ticket_k = [300, 700]
enter_ptick = 2e-3
exit_ptick = 2e-3
dep_dev_ref = 0.02
dep_halflife = 90.0

# -- the injection: class 10, the liquidity withdrawal ------------------- #
[agents.LpExitAgent]
exit_day = 365
frac = 0.5
venue = "ub"
depth_m = 10.0
