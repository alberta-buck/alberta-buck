# CONVERGENCE E3 (doc/CONVERGENCE.org section 5): do the harvest legs add?
# E2's baseline on the calm arm, and the two savings-basket harvesters crossed:
# the rebalance director (leg 2: commodity relative value; the family's
# DirectorKeeperAgent, on by default) and the consistency wheel (leg 1: venue
# consistency; the Solidity BasketWheel, TOKEN start, E1's best).  The base is
# the director alone; the three other corners are the preset's values.
name = "conv-e3"
notes = "E3: director on/off x wheel off/on on the none arm"
objective = "the legs' takes, separately and together; receipts against hold"

[baseline]
"scenario.basket" = "ops"
"scenario.agents.MonetaryKeeperAgent" = 1
"scenario.agents.ExcursionArbAgent" = 5
"scenario.agents.ExcursionCreditArbAgent" = 3
"scenario.agents.ExcursionBasketArbAgent" = 4
"scenario.agents.ExcursionBuckArbAgent" = 2
"scenario.agents.CommodityRebalArbAgent" = 2
"scenario.agents.UndertakingAgent" = 1
"scenario.agents.FacilityAgent" = 0
"scenario.agents.SeederAgent" = 0
"agents.UndertakingAgent.eps" = 0.005
"agents.UndertakingAgent.p" = 1.0
"agents.UndertakingAgent.leg_bp" = 40
"agents.UndertakingAgent.reserve_frac" = 0.5
SIM_CONTROLLER = "direct"
SIM_OPS_POSITION_BP = 1000
SIM_OPS_OUTRIGHT_BP = 1000
SIM_OPS_LEG_BP = 40

[presets.legs]
director = {}
neither = { "scenario.agents.DirectorKeeperAgent" = 0 }
both = { "scenario.agents.BasketWheelAgent" = 1, "agents.BasketWheelAgent.impl" = "solidity", "agents.BasketWheelAgent.start" = "token", "agents.BasketWheelAgent.cap_bp" = 200, "agents.BasketWheelAgent.max_work" = 12, "agents.BasketWheelAgent.chain" = "l2", "agents.BasketWheelAgent.call" = "profitable" }
wheel = { "scenario.agents.BasketWheelAgent" = 1, "agents.BasketWheelAgent.impl" = "solidity", "agents.BasketWheelAgent.start" = "token", "agents.BasketWheelAgent.cap_bp" = 200, "agents.BasketWheelAgent.max_work" = 12, "agents.BasketWheelAgent.chain" = "l2", "agents.BasketWheelAgent.call" = "profitable", "scenario.agents.DirectorKeeperAgent" = 0 }

[[arm]]
name = "none"
toml = "catalogue-none.toml"

[[axis]]
name = "legs"
preset = "legs"
base = "director"
values = ["neither", "both", "wheel"]
