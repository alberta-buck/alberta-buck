# CONVERGENCE E4 (doc/CONVERGENCE.org section 5): the organic cast on the bursts.
# E2's baseline with the wheel ON, and the 30 endog debtors replaced by T15's
# external-debt retirees (the organic-retiree.toml household, verbatim) -- the
# credit channel decided, not scheduled -- on the five arms that decide (A).
# The retirees and the wheel are appended in this order, after every other
# agent (house rule 12).  Compare with E2's wheel-on cells of the same arms.
name = "conv-e4"
notes = "E4: E2's full stack + wheel, with the retiree cast, on five burst arms"
objective = "the parity gate with the organic credit channel; the wheel and the retirees together"

[baseline]
"scenario.basket" = "ops"
"scenario.agents.MonetaryKeeperAgent" = 1
"scenario.agents.ExcursionArbAgent" = 5
"scenario.agents.ExcursionCreditArbAgent" = 3
"scenario.agents.ExcursionBasketArbAgent" = 4
"scenario.agents.ExcursionBuckArbAgent" = 2
"scenario.agents.CommodityRebalArbAgent" = 2
"scenario.agents.UndertakingAgent" = 1
"scenario.agents.FacilityAgent" = 0
"scenario.agents.SeederAgent" = 0
"agents.UndertakingAgent.eps" = 0.005
"agents.UndertakingAgent.p" = 1.0
"agents.UndertakingAgent.leg_bp" = 40
"agents.UndertakingAgent.reserve_frac" = 0.5
SIM_CONTROLLER = "direct"
SIM_OPS_POSITION_BP = 1000
SIM_OPS_OUTRIGHT_BP = 1000
SIM_OPS_LEG_BP = 40
"scenario.agents.BuckCreditDebtorAgent" = 0
"scenario.agents.ExternalDebtRetireeAgent" = 30
"agents.ExternalDebtRetireeAgent.theta" = [0.0, 3.0]
"agents.ExternalDebtRetireeAgent.apr" = [0.045, 0.065]
"agents.ExternalDebtRetireeAgent.home_k" = [200, 1500]
"agents.ExternalDebtRetireeAgent.ltv" = [0.05, 0.95]
"agents.ExternalDebtRetireeAgent.income_frac" = [0.20, 0.35]
"agents.ExternalDebtRetireeAgent.premium_bp" = [25, 50]
"agents.ExternalDebtRetireeAgent.save_rate" = [0.25, 0.75]
"agents.ExternalDebtRetireeAgent.term_months" = 60
"agents.ExternalDebtRetireeAgent.renew_frac" = [0.0, 1.0]
"agents.ExternalDebtRetireeAgent.penalty_months" = 3.0
"agents.ExternalDebtRetireeAgent.switch_k" = [1.0, 3.0]
"agents.ExternalDebtRetireeAgent.risk" = [0.0, 0.01]
"scenario.agents.BasketWheelAgent" = 1
"agents.BasketWheelAgent.impl" = "solidity"
"agents.BasketWheelAgent.start" = "token"
"agents.BasketWheelAgent.cap_bp" = 200
"agents.BasketWheelAgent.max_work" = 12
"agents.BasketWheelAgent.chain" = "l2"
"agents.BasketWheelAgent.call" = "profitable"

[[arm]]
name = "none"
toml = "catalogue-none.toml"

[[arm]]
name = "squeeze-x4"
toml = "catalogue-squeeze.toml"
sets = { "agents.WhaleRaidAgent.budget_m" = [32, 48], "agents.WhaleRaidAgent.quiet_cap_bp" = 200 }

[[arm]]
name = "dump-x4"
toml = "catalogue-dump.toml"
sets = { "agents.WhaleRaidAgent.budget_m" = [32, 48], "agents.WhaleRaidAgent.quiet_cap_bp" = 200 }

[[arm]]
name = "cohort-step"
toml = "catalogue-cohort-step.toml"

[[arm]]
name = "bookload"
toml = "catalogue-bookload.toml"
