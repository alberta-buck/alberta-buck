# E3's EQUITY TWIN (doc/CONVERGENCE.org): do the harvest legs add, on the
# equity basket (equity-ops)?  The legs are its own: the director's lean
# (leg 2, EquityTurnDirector -- SIM_EQUITY_DIRECTOR=0 deploys none, and the
# components keep the plain band) and the wheel's arbitrage (leg 1,
# SIM_WHEEL_ARB).  The wheel's agent is cast in every corner (it places the
# deposits); the pro-rata director's keeper is not (the equity basket has its
# own director).  Every level sets both switches, since a star pins its base
# level in every cell of the arm.  Paired against conv-e3 by cell label.
extends = "conv-e3"
name = "conv-e3-eq"
notes = "E3 twin: equity-ops, director lean x wheel arbitrage on the none arm"
objective = "the equity basket's legs, separately and together, against conv-e3's corners"

[baseline]
"scenario.basket" = "equity-ops"
"scenario.agents.DirectorKeeperAgent" = 0
"scenario.agents.BasketWheelAgent" = 1
"agents.BasketWheelAgent.impl" = "solidity"
"agents.BasketWheelAgent.start" = "token"
"agents.BasketWheelAgent.cap_bp" = 200
"agents.BasketWheelAgent.max_work" = 12
"agents.BasketWheelAgent.chain" = "l2"
"agents.BasketWheelAgent.call" = "profitable"

[presets.legs]
director = { SIM_WHEEL_ARB = "0", SIM_EQUITY_DIRECTOR = "1" }
neither = { SIM_WHEEL_ARB = "0", SIM_EQUITY_DIRECTOR = "0" }
wheel = { SIM_WHEEL_ARB = "1", SIM_EQUITY_DIRECTOR = "0" }
both = { SIM_WHEEL_ARB = "1", SIM_EQUITY_DIRECTOR = "1" }
