# CONVERGENCE E2 (doc/CONVERGENCE.org section 5): the full stack on the bursts.
# Cycle 1's baseline (the ops basket, the desk, the engaged undertakings, the
# defender mix) with design A -- the price-only controller of record -- fixed,
# and one axis: the consistency wheel off / on (the Solidity BasketWheel,
# TOKEN start so its profit reaches the depositors, cap 2% and 12 cycles per
# call -- E1's best -- on L2 gas).  The wheel's agent is appended last, so every
# other agent keeps its number and its keyed random stream (house rule 12).
# Arms: the calm control; the BUCK DEMAND shocks (squeeze x1 / x4, a cohort
# of new debtors, a grind up); the BUCK SUPPLY shocks (dump x1 / x4, half the
# savers wound down, a grind down); the book-loading attack; an LP exit.
name = "conv-e2"
notes = "E2: design A + undertakings + desk, wheel off/on, on eleven burst arms"
objective = "parity gate on every arm with the wheel on; the wheel's take and the depositors' P&L against off"

[baseline]
"scenario.basket" = "ops"
"scenario.agents.MonetaryKeeperAgent" = 1
"scenario.agents.ExcursionArbAgent" = 5
"scenario.agents.ExcursionCreditArbAgent" = 3
"scenario.agents.ExcursionBasketArbAgent" = 4
"scenario.agents.ExcursionBuckArbAgent" = 2
"scenario.agents.CommodityRebalArbAgent" = 2
"scenario.agents.UndertakingAgent" = 1
"scenario.agents.FacilityAgent" = 0
"scenario.agents.SeederAgent" = 0
"agents.UndertakingAgent.eps" = 0.005
"agents.UndertakingAgent.p" = 1.0
"agents.UndertakingAgent.leg_bp" = 40
"agents.UndertakingAgent.reserve_frac" = 0.5
SIM_CONTROLLER = "direct"
SIM_OPS_POSITION_BP = 1000
SIM_OPS_OUTRIGHT_BP = 1000
SIM_OPS_LEG_BP = 40

[presets.wheel]
off = {}
on = { "scenario.agents.BasketWheelAgent" = 1, "agents.BasketWheelAgent.impl" = "solidity", "agents.BasketWheelAgent.start" = "token", "agents.BasketWheelAgent.cap_bp" = 200, "agents.BasketWheelAgent.max_work" = 12, "agents.BasketWheelAgent.chain" = "l2", "agents.BasketWheelAgent.call" = "profitable" }

[[arm]]
name = "none"
toml = "catalogue-none.toml"

[[arm]]
name = "squeeze-x1"
toml = "catalogue-squeeze.toml"

[[arm]]
name = "squeeze-x4"
toml = "catalogue-squeeze.toml"
sets = { "agents.WhaleRaidAgent.budget_m" = [32, 48], "agents.WhaleRaidAgent.quiet_cap_bp" = 200 }

[[arm]]
name = "cohort-add"
toml = "catalogue-cohort-add.toml"

[[arm]]
name = "grind-up"
toml = "catalogue-grind-up.toml"

[[arm]]
name = "dump-x1"
toml = "catalogue-dump.toml"

[[arm]]
name = "dump-x4"
toml = "catalogue-dump.toml"
sets = { "agents.WhaleRaidAgent.budget_m" = [32, 48], "agents.WhaleRaidAgent.quiet_cap_bp" = 200 }

[[arm]]
name = "cohort-step"
toml = "catalogue-cohort-step.toml"

[[arm]]
name = "grind-down"
toml = "catalogue-grind-down.toml"

[[arm]]
name = "bookload"
toml = "catalogue-bookload.toml"

[[arm]]
name = "lpexit"
toml = "catalogue-lpexit.toml"

[[axis]]
name = "wheel"
preset = "wheel"
base = "off"
values = ["on"]
