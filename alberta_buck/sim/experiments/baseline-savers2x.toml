# Baseline variant: STRONGER counter-cyclical saver demand.  The plain
# baseline passes at 2/5 seeds; the failing seeds settle mildly rich
# (bv 0.95-0.98) with the issuance plant saturated (funding-throttled or
# capacity-limited).  Savers are the demand-side lever that pushes bv UP
# from below parity regardless of which borrower constraint binds: sell
# harder into richness (prem_gain) with deeper budgets to cycle.

name = "baseline-savers2x"
notes = "baseline + saver prem_gain [8,15], budget_m [40,80]"

[scenario]
years = 5.0
ticks_per_day = 1
day_step = 10
seed = 0xA1BC

[agents.SaverAgent]
prem_gain = [8.0, 15.0]
budget_m = [40, 80]
