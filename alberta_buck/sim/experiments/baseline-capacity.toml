# Worst-seed attribution probe: savers2x demand PLUS borrower capacity
# headroom (face_m [3,7] vs [2,5]).  Seed 99's plain-baseline failure was
# capacity-limited (throttle ~4%, face fully drawn, K pinned); savers2x
# alone moved it to jointly funding+capacity bound.  If knobs alone can
# carry the worst seed to parity, this is the config; if not, the residual
# is the fixed population's missing extensive margin (new borrowers entering
# when credit is attractive) -- the "richer agent simulator" direction.

name = "baseline-capacity"
notes = "savers2x + borrower face_m [3,7], fund_budget_m [5,9]"

[scenario]
years = 5.0
ticks_per_day = 1
day_step = 10
seed = 0xA1BC

[agents.FatCreditBorrowerAgent]
face_m = [3, 7]
fund_budget_m = [5, 9]

[agents.SaverAgent]
prem_gain = [8.0, 15.0]
budget_m = [40, 80]
