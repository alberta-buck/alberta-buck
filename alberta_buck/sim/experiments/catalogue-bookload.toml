# Excursion CATALOGUE arm "bookload" -- the portcast cast (settled physics,
# keyed rng, no FatCredit) on a 2-year window with ONE injected excursion
# at day 365.  The defender mix and intensity are swept from outside
# (alberta_buck.sim.catalogue overrides the Excursion*/CommodityRebal
# counts); this file fixes the physics and the injection only.
# Design of record: REBALANCING-EQ.org, "The excursion catalogue";
# WP-15: WAVE3.org test-plan class 9 (prediction 10, gate P10: the risk of
# an inventory-fed K).  BookLoaderAgent (bookloader.py) sells BUCK into
# the basket pools from load_day so the weak-side ladder absorbs toward
# rho_target, holds hold_days while the position loop moves K, unwinds
# and books the round trip par-marked (frame bl_*).  The attack needs a
# book to load: run it with the undertakings (mix ut / ut-all, or the
# star's baseline); the none mix is the undefended twin.
name = "catalogue-bookload"
notes = "class 9 book-loading attack: BookLoaderAgent loads the undertakings' ladder from day 365, holds 30 days, unwinds and books the round trip"

[scenario]
family = "rebalancing-eq"
rng = "keyed"
years = 2.0
ticks_per_day = 4
day_step = 1
seed = 0xA1BC

[deploy]
target_buck_lp_m = 50.0     # deep national-scale BUCK/USDC exit route

[scenario.agents]
BookLoaderAgent = 1
FatCreditBorrowerAgent = 0
BuckCreditDebtorAgent = 30
DirectMintAgent = 120
DirectMintBuckAgent = 30
ArrivingDMAgent = 60
ExcursionArbAgent = 5
ExcursionCreditArbAgent = 3

[agents.SaverAgent]
arrive_mode = "endow"
endow_m = [1, 3]

[agents.BuckCreditDebtorAgent]
theta = [0.0, 3.0]
apr = [0.045, 0.065]
home_k = [200, 1500]        # appraised home value, $k, LOG-uniform
ltv = [0.05, 0.95]          # seasoned mortgage ladder, mean ~50% LTV
income_frac = [0.20, 0.35]  # homes at ~3-5x income
premium_bp = [50, 150]
save_rate = [0.25, 0.75]
refi_mode = "atomic"        # ex-ante whole-conversion evaluation
arrive_mode = "endog"
arrive_frac = [0.0, 1.0]
arr_gain = 5.0
arr_max = 3.0
arr_k_ref = 0.75

[agents.ArrivingDMAgent]
arrive_mode = "endog"
arrive_frac = [0.0, 1.0]
ticket_k = [300, 700]
enter_ptick = 2e-3
exit_ptick = 2e-3
dep_dev_ref = 0.02
dep_halflife = 90.0

# -- the injection: class 9, the book-loading attack --------------------- #
[agents.BookLoaderAgent]
budget_m = [20, 30]
side = "sell"
load_day = 365
load_days = 60
hold_days = 30
unwind_days = 15
rho_target = 0.5
dev_target = 0.03
push_bp = 800
