# The server-backed SAVINGS WORLD (doc/CONVERGENCE.org 7a): the full stack of
# section 6.3 on five years of five commodities, lean enough for interactive
# speed.  The history's sixth constituent, bitcoin, is left out: a basket
# holds TOKENs for real commodities, bounded by what they cost to make and to
# replace, and its 6% is shared over the five.
# The catalogue's physics (keyed rng, the portcast settings, a deep BUCK/USDC
# exit route) with 24 opening depositors and a continuing household population:
# mortgage refinancers and insured credit savers, with staggered decisions.
# Kept: the desk and the engaged undertakings, the director, the
# Solidity work wheel (TOKEN start: its harvest reaches the depositors), the
# market (the whale pinning TOKEN/USDC to the references, the arbs), the
# savers.  The basket is the equity basket with the desk, on the basket machine
# (equity-machine; doc/BASKET-MACHINE.org): a credit holder that pairs every
# deposit with BUCKs it issues itself and pays exits in BUCK, sized by a
# [machine] table (alberta_buck/sim/basket_machine.py DEFAULTS).
# basket = "equity-ops" runs the same basket and desk on the earlier upkeep
# (wheel components that place deposits and keep a BUCK liquidity target;
# alberta-buck-ethereum.org, "BuckBasketEquity"); the page's world settings
# offer both.  Served by alberta_buck.sim.server; a session may override
# anything here with ?set=.
name = "demo-savings"
notes = "the savings demonstration's world: full stack, lean cast, two ticks a day"

[scenario]
family = "rebalancing-eq"
rng = "keyed"
years = 5.0
ticks_per_day = 2
day_step = 1
seed = 0xA1BC
basket = "equity-machine"
tokens = ["LABR", "CNST", "FOOD", "NRGC", "PAXG"]

[deploy]
target_buck_lp_m = 50.0     # deep national-scale BUCK/USDC exit route

[scenario.agents]
FatCreditBorrowerAgent = 0
BuckCreditDebtorAgent = 0
DirectMintAgent = 24
DirectMintBuckAgent = 6
ArrivingDMAgent = 0
ExcursionArbAgent = 3
ExcursionCreditArbAgent = 1
UndertakingAgent = 1
MonetaryKeeperAgent = 1     # turns the BasketDesk beside the basket (its own account and credit)
ExternalDebtRetireeAgent = 0
HouseholdPopulationAgent = 1
BasketWheelAgent = 1
ShockAgent = 1             # the page's demand / supply shock buttons arm it

[agents.SaverAgent]
arrive_mode = "endow"
endow_m = [1, 3]

[agents.HouseholdPopulationAgent]
initial = 10
arrival_rate = 6.0          # new households/year, throughout the horizon
max_members = 256
saver_share = 0.5          # insured savers; the rest carry external mortgages
surplus_policy = "adaptive"

[agents.UndertakingAgent]
eps = 0.005
p = 1.0

[agents.BasketWheelAgent]
impl = "solidity"
start = "token"
cap_bp = 200
max_work = 12
chain = "l2"                # the page's L1 / L2 toggle sets this live
call = "profitable"

[agents.ExternalDebtRetireeAgent]
theta = [0.0, 3.0]          # payback years for one-time costs
apr = [0.045, 0.065]        # the external mortgage rate
home_k = [200, 1500]        # appraised home value, $k, LOG-uniform
ltv = [0.05, 0.95]          # seasoned mortgage ladder, mean ~50% LTV
income_frac = [0.20, 0.35]  # homes at ~3-5x income
premium_bp = [25, 50]       # home insurance, %/yr of the insured value
save_rate = [0.25, 0.75]
term_months = 60            # five-year terms
renew_frac = [0.0, 1.0]     # a seasoned ladder of renewal dates
penalty_months = 3.0        # prepayment penalty off renewal
switch_k = [1.0, 3.0]       # legal, appraisal, discharge, $k
risk = [0.0, 0.01]          # /yr for owing basket-indexed BUCK
