[package]
# Published as alberta-buck-wallet; imported as buck_wallet.
name = "alberta-buck-wallet"
description = "Alberta Buck wallet kernel: canonical identity JSON, the AB-RCPT/1 envelope, receipt build/verify and the Notes flows matching the alberta_buck.wallet reference bit-for-bit"
keywords = ["wallet", "receipt", "privacy", "ethereum", "stablecoin"]
categories = ["cryptography::cryptocurrencies", "finance"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "buck_wallet"

[dependencies]
# Keyed to the import names; path AND version, as crates.io requires.
buck_identity = { package = "alberta-buck-identity", path = "../buck-identity", version = "0.1" }
buck_registry = { package = "alberta-buck-registry", path = "../buck-registry", version = "0.1" }
# arbitrary_precision keeps integer tokens as their exact text, so the
# canonical writer can enforce the dialect (ints of any size, no floats)
# without ever routing a value through f64.
serde_json = { version = "1", features = ["arbitrary_precision"] }
# Receipt ids are base32(sha256(canonical_bytes)); RustCrypto sha2 is the
# one non-arkworks crypto dependency (std, wasm-clean).
sha2 = "0.10"
