[package]
name = "buck-math-wasm"
version = "0.0.1"
edition = "2021"
description = "WASM/JS binding for the buck-math kernel (browser + Node)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kernel = { path = "../../buck-math", package = "buck-math" }
# u128/i128 cross as JS BigInt.
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
# Skip the wasm-opt download/pass: one less moving part; the kernel is
# tiny integer math and needs no size heroics.
wasm-opt = false
