[package]
# A build artifact, not a library: the wasm package is what ships (npm
# alberta-buck-kernel), never this crate.
name = "buck-identity-wasm"
description = "WASM/JS binding for the buck-identity kernel (browser + Node)"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kernel = { path = "../../buck-identity", package = "alberta-buck-identity" }
# The wallet + registry kernels ride in the SAME wasm blob (one arkworks
# copy): structured wallet inputs cross as JSON-args texts, certificates
# as their wire bytes, the trees as exported classes.
wallet = { path = "../../buck-wallet", package = "alberta-buck-wallet" }
registry = { path = "../../buck-registry", package = "alberta-buck-registry" }
serde_json = { version = "1", features = ["arbitrary_precision"] }
# 256-bit words cross the ABI as 0x-hex strings; core/js/src/identity.js
# wraps this in the BigInt-native API.
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
# Size pass for the published package: binaryen comes from the dev shell
# (flake.nix), so wasm-pack finds wasm-opt on PATH instead of downloading
# it.  -Os took buck_identity from 1,229,180 to 1,025,103 bytes; the
# vector suites replay identically after it.
wasm-opt = ["-Os"]
