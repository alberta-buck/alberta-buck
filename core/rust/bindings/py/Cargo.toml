[package]
# A build artifact, not a library: the wheel is what ships (PyPI
# alberta-buck-kernel), never this crate.
name = "buck-math-py"
description = "Python binding for the buck-math kernel (import buck_math)"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "buck_math"
crate-type = ["cdylib"]

[dependencies]
# Aliased: the cdylib itself is named buck_math (the Python module), which
# would shadow the kernel crate's name in paths.
kernel = { path = "../../buck-math", package = "alberta-buck-math" }
# abi3-py311: one artifact serves CPython >= 3.11.
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py311"] }
