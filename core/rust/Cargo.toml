# Alberta Buck core kernel workspace (see alberta-buck-platform.org, Layer 2).
#
# Crates land by phase: buck-math (Phase 2), buck-identity (Phase 3),
# buck-wallet + bindings/js (wasm-bindgen) + bindings/py (PyO3) alongside.
# buck-math stays no_std/zero-dep; buck-identity is std over arkworks
# (wasm-clean; the no_std flip is mechanical if a Holochain zome needs it
# -- the holo-mutualcredit pattern still applies).

# Shared package metadata (alberta-buck-deployment.org, D2/D3/D4): the four
# kernel crates publish to crates.io as alberta-buck-<kernel> and move as ONE
# version -- they are one artifact compiled three ways, and a bit-identical
# guarantee that spans versions is not a guarantee.  The bindings/ crates are
# build artifacts (publish = false) and inherit only for consistency.
[workspace.package]
version = "0.3.0"
edition = "2021"
license = "CAL-1.0"
repository = "https://github.com/alberta-buck/alberta-buck"
authors = ["Perry Kundert <perry@dominionrnd.com>"]

[workspace]
resolver = "2"
members = [
    "buck-math",
    "buck-identity",
    "buck-registry",
    "buck-wallet",
    "bindings/py",
    "bindings/js",
    "bindings/py-identity",
    "bindings/js-identity",
]

[profile.release]
lto = true
opt-level = "s"
# Kernel correctness over speed: Solidity 0.8 checked arithmetic reverts
# on overflow; the kernel must panic there too, in every profile.
overflow-checks = true
