<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BUCK Run Dashboard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="title">
      <h1>BUCK run dashboard</h1>
      <p id="meta" class="meta"></p>
    </div>
    <div class="controls">
      <label for="run">Run</label>
      <select id="run"></select>
      <span id="status" class="status" role="status"></span>
      <button id="theme" type="button" class="ghost">Theme: auto</button>
    </div>
  </header>
  <div id="new-session" class="new-session-wrap"></div>
  <section id="live" class="live" aria-label="Live session controls" hidden></section>
  <nav id="tabs" class="tabs" role="tablist" aria-label="Ecosystem components"></nav>
  <div id="range" class="filters" role="group" aria-label="Time range">
    <span class="filter-label">Days shown</span>
    <button type="button" data-range="all" aria-pressed="true">All</button>
    <button type="button" data-range="30" aria-pressed="false">Last 30</button>
    <button type="button" data-range="90" aria-pressed="false">Last 90</button>
    <button type="button" data-range="365" aria-pressed="false">Last 365</button>
  </div>
  <p id="problem" class="problem" role="alert" hidden></p>
  <p id="empty" class="empty" hidden>No days recorded yet.</p>
  <main id="overview" class="panel" role="tabpanel" aria-label="Overview"></main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
