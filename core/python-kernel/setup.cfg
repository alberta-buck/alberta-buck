# The extension is built abi3-py311 (see core/rust/bindings/py*/Cargo.toml),
# so ONE wheel per platform serves every CPython from 3.11 onward.  Without
# this, setuptools tags the wheel for the exact interpreter that built it
# (cp313-cp313-...) and 3.11, 3.12 and 3.14 users get no wheel at all.
[bdist_wheel]
py_limited_api = cp311
