[project]
name = "alberta-buck-contracts"
version = "0.2.1"
description = "Compiled ABI and bytecode for the Alberta Buck contracts (unaudited prototype), including the Notes pool and Groth16 verifiers from a DEVELOPMENT trusted setup (forgeable until v1.0.0), built with a pinned compiler"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
    { name = "Perry Kundert", email = "perry@dominionrnd.com" }
]
keywords = ["ethereum", "solidity", "abi", "stablecoin", "artifacts", "groth16", "zk-snark"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/alberta-buck/alberta-buck"
"Bug Tracker" = "https://github.com/alberta-buck/alberta-buck/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["buck_contracts*"]

[tool.setuptools.package-data]
# The bundle itself.  Generated by scripts/contracts-dist.py --emit, hence
# gitignored -- but it IS the package, so it must ship in wheels and sdists.
buck_contracts = ["*.json"]
