# buck-core: the Alberta Buck core platform, Python side.
#
# Not yet published; during the transition the alberta_buck package makes
# this importable from a repo checkout via a sys.path shim (see
# alberta_buck/__init__.py and alberta-buck-platform.org, Phase 0/2).
# `pip install -e core/python` works today for external consumers.

[project]
name = "alberta-buck-core"
version = "0.3.0"
description = "Alberta Buck core platform (Python): the ChainSession API over anvil/testnets/pyrevm with expectation journaling, and the Foundry artifact loader"
readme = "README.md"
license = "CAL-1.0"
license-files = ["LICENSE"]
authors = [
    { name = "Perry Kundert", email = "perry@dominionrnd.com" }
]
keywords = ["ethereum", "stablecoin", "simulation", "web3"]
requires-python = ">=3.11"
dependencies = [
    "web3>=7",
    # The contract artifacts, so an installed package can deploy a world
    # without a repo checkout (buck_core.artifacts.load_artifact).
    "alberta-buck-contracts>=0.3.0,<0.4",
]

[project.optional-dependencies]
# The compiled kernels: optional by construction.  Everything they do has a
# pure-Python equivalent, so this only makes it faster.
kernel = ["alberta-buck-kernel>=0.3.0,<0.4"]

[project.urls]
Homepage = "https://github.com/alberta-buck/alberta-buck"
"Bug Tracker" = "https://github.com/alberta-buck/alberta-buck/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["buck_core*"]

# No package-data: this is deliberately a PURE Python wheel
# (py3-none-any).  The compiled kernels live in alberta-buck-kernel; the
# buck_core.buck_* modules here are shims that delegate to it, so that
# depending on the session/journal API does not drag a per-platform wheel
# matrix along.  A repo checkout still has the built .so beside the shim,
# and CPython prefers the extension.
