[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_limit = "18446744073709551615"   # u64::MAX -- the simulation test runs hundreds of millions of gas
memory_limit = 1073741824             # 1 GiB -- JSON serialisation accumulates a large memory string
auto_detect_solc = true
evm_version = "cancun"
ffi = false
fs_permissions = [
    { access = "read-write", path = "./test/vectors" },
    { access = "read", path = "./alberta_buck/test/vectors" },
    { access = "read", path = "./build/snark" },
    { access = "read", path = "./out" },
    { access = "read", path = "./alberta_buck/sim/prices" },
    { access = "read", path = "./lib/universal-router/out" },
]

# Remappings for installed dependencies
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/",
    "@uniswap/v3-core/=lib/v3-core/",
    "@uniswap/v3-periphery/=lib/v3-periphery/",
    "@uniswap/v2-core/=lib/v2-core/",
    "@uniswap/v2-periphery/=lib/v2-periphery/",
    "@uniswap/lib/=lib/solidity-lib/",
]

[profile.v3]
via_ir = true
src = "src/uniswap_v3_build"
out = "out"

# The reproducible build behind the published alberta-buck-contracts
# package.  Everything that can drift is pinned HERE rather than passed on
# a command line, so the emitted bytecode is a function of the repository
# state alone (alberta-buck-deployment.org, P2.5).
#
# Why this profile has to exist: `make build` passes --use 0.8.28, but
# `make build-uniswap-artifacts` runs a bare `forge build`, and both write
# out/.  With auto_detect_solc the second one picks the newest compiler
# installed, so out/ held 0.8.31 artifacts -- the very version the 0.8.28
# pin exists to avoid ("Modifiers not implemented yet", an IR codegen bug).
# Which compiler produced out/ depended on which target ran last.  A
# published artifact cannot be decided that way.
#
#   solc  exact, overriding auto_detect_solc: no ambient choice.
#   out   a separate directory: a dev build cannot contaminate a published
#         one, and vice versa.
#
# Moving the solc pin changes every byte of the output.  It is a package
# version event, not a maintenance detail.
[profile.dist]
solc = "0.8.28"
out = "out-dist"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 500 }
